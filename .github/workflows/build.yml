# 每次 push 编译（语法门禁）；v* tag push 时生成 SHA256 并自动发布 release。
name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15  # 兜底：任何挂起最长烧 15 分钟
    permissions:
      contents: write  # tag push 时 softprops/action-gh-release 需要

    env:
      # 官方工具链，显式锁定版本（升级需人工确认）
      AHK_TAG: v2.0.26
      AHK_ZIP: AutoHotkey_2.0.26.zip
      AHK2EXE_TAG: Ahk2Exe1.1.37.02a2
      AHK2EXE_ZIP: Ahk2Exe1.1.37.02a2.zip
      OUT_EXE: AliceMacro.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download AutoHotkey v2 + Ahk2Exe (pinned)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path tools | Out-Null

          $ahkUrl = "https://github.com/AutoHotkey/AutoHotkey/releases/download/$env:AHK_TAG/$env:AHK_ZIP"
          $a2xUrl = "https://github.com/AutoHotkey/Ahk2Exe/releases/download/$env:AHK2EXE_TAG/$env:AHK2EXE_ZIP"

          Invoke-WebRequest -Uri $ahkUrl -OutFile "tools\$env:AHK_ZIP"
          Invoke-WebRequest -Uri $a2xUrl -OutFile "tools\$env:AHK2EXE_ZIP"

          Expand-Archive "tools\$env:AHK_ZIP" -DestinationPath tools\AutoHotkey -Force
          Expand-Archive "tools\$env:AHK2EXE_ZIP" -DestinationPath tools\Compiler -Force

          # zip 根目录布局可能有差异，统一按文件名定位
          $base = Get-ChildItem -Path tools\AutoHotkey -Recurse -Filter AutoHotkey64.exe | Select-Object -First 1
          $compiler = Get-ChildItem -Path tools\Compiler -Recurse -Filter Ahk2Exe.exe | Select-Object -First 1
          if (-not $base) { throw 'AutoHotkey64.exe not found after extract' }
          if (-not $compiler) { throw 'Ahk2Exe.exe not found after extract' }

          "AHK_BASE=$($base.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "AHK2EXE=$($compiler.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Base: $($base.FullName)"
          Write-Host "Compiler: $($compiler.FullName)"

      - name: Compile (syntax gate)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path $env:OUT_EXE) { Remove-Item $env:OUT_EXE -Force }

          # Ahk2Exe 是 GUI 子系统程序：pwsh 的 & 调用不会等待，必须 Start-Process 显式等待
          # /compress 0  → 不压缩（UPX/MPRESS 不在 runner 上，且压缩易触发误报）
          # /silent verbose → 无 GUI 弹窗，错误走 stderr/stdout
          $argLine = '/in "AliceMacro.ahk" /out "{0}" /icon "Alice.ico" /base "{1}" /compress 0 /silent verbose' -f $env:OUT_EXE, $env:AHK_BASE
          Write-Host "Compiler: $env:AHK2EXE (exists: $(Test-Path $env:AHK2EXE))"
          Write-Host "Base:     $env:AHK_BASE (exists: $(Test-Path $env:AHK_BASE))"
          Write-Host "Icon:     Alice.ico (exists: $(Test-Path Alice.ico))"
          Write-Host "Args:     $argLine"

          $stdOut = Join-Path $env:RUNNER_TEMP 'ahk2exe.stdout.txt'
          $stdErr = Join-Path $env:RUNNER_TEMP 'ahk2exe.stderr.txt'
          # 注意：不用 Start-Process -Wait —— 它会连带等待所有后代进程，
          # Ahk2Exe 的 /iLib 校验子进程若因 #Warn 弹窗等原因未退出就会死等
          # （实测：脚本引用不存在的函数名时校验器弹模态警告框，headless 上死等）。
          # 改为只等本进程 + 显式超时，超时杀进程并回传诊断。
          $proc = Start-Process -FilePath $env:AHK2EXE -ArgumentList $argLine -PassThru -NoNewWindow `
            -RedirectStandardOutput $stdOut -RedirectStandardError $stdErr
          if (-not $proc.WaitForExit(180000)) {
            try { $proc.Kill() } catch {}
            $tout = Get-Content $stdOut -Raw -ErrorAction SilentlyContinue
            $terr = Get-Content $stdErr -Raw -ErrorAction SilentlyContinue
            $tdiag = "TIMEOUT 180s; stdout=$tout; stderr=$terr" -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A'
            Write-Host "::error file=AliceMacro.ahk,title=Ahk2Exe hang::$tdiag"
            exit 1
          }
          $code = $proc.ExitCode
          $out = Get-Content $stdOut -Raw -ErrorAction SilentlyContinue
          $err = Get-Content $stdErr -Raw -ErrorAction SilentlyContinue
          Write-Host "ExitCode: $code"
          Write-Host "--- stdout ---"; Write-Host $out
          Write-Host "--- stderr ---"; Write-Host $err

          if ($code -ne 0 -or -not (Test-Path $env:OUT_EXE) -or (Get-Item $env:OUT_EXE).Length -lt 1KB) {
            # 注解通道：诊断信息写入 check-run annotation（无需 token 即可经 API 读取）
            $diag = "exit=$code; stdout=$out; stderr=$err" -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A'
            Write-Host "::error file=AliceMacro.ahk,title=Ahk2Exe compile failed::$diag"
            exit 1
          }
          Write-Host "Compiled OK: $((Get-Item $env:OUT_EXE).Length) bytes"

      - name: SHA256 checksum
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          sha256sum "$OUT_EXE" | tee "${OUT_EXE}.sha256"
          cat "${OUT_EXE}.sha256"

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            AliceMacro.exe
            AliceMacro.exe.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
